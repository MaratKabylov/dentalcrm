name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dental_test
          POSTGRES_USER: dental
          POSTGRES_PASSWORD: dental_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dental -d dental_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dental:dental_test@localhost:5432/dental_test
      AUTH_MODE: development
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm check
      - run: pnpm --filter @dental/api test:integration
